services:
  lemon-sandbox:
    image: ${LEMON_SANDBOX_IMAGE:-ghcr.io/petri-hub/lemon-sandbox:latest}
    container_name: lemon-sandbox
    restart: unless-stopped
    environment:
      - TZ=${LEMON_SANDBOX_TZ}
      - JEST_ROBLOX_OPEN_CLOUD_API_KEY=${LEMON_OPEN_CLOUD_API_KEY}
      - JEST_ROBLOX_UNIVERSE_ID=${LEMON_OPEN_CLOUD_UNIVERSE_ID}
      - JEST_ROBLOX_PLACE_ID=${LEMON_OPEN_CLOUD_PLACE_ID}
      - ROBLOX_API_KEY=${LEMON_ROBLOX_ASSETS_API_KEY}
      - ROBLOX_OWNER_ID=${LEMON_ROBLOX_ASSETS_OWNER_ID}
      - ROBLOX_OWNER_TYPE=${LEMON_ROBLOX_ASSETS_OWNER_TYPE}
    networks:
      - lab
    volumes:
      - type: bind
        source: ../../storage/lemon-sandbox/workspace
        target: /home/lemon/workspace
        bind:
          create_host_path: false
      - type: bind
        source: ../../storage/lemon-sandbox/ssh-host-keys
        target: /var/lib/lemon/ssh
        bind:
          create_host_path: false
      - type: bind
        source: ../../storage/lemon-sandbox/authorized_keys
        target: /home/lemon/.ssh/authorized_keys
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

networks:
  lab:
    name: lab
    external: true
