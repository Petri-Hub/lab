services:
  restic-satisfactory:
    image: restic/restic:latest
    container_name: restic-satisfactory
    restart: unless-stopped
    entrypoint: /bin/sh
    command: '-c "tail -f /dev/null"'
    environment:
      - RESTIC_REPOSITORY=rest:http://rclone:${RESTIC_RCLONE_SERVER_PORT}/satisfactory/
      - RESTIC_PASSWORD=${RESTIC_SATISFACTORY_PASSWORD}
    volumes:
      - ../../../storage/satisfactory/saved:/data:ro
    networks:
      - lab
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.backup-satisfactory.schedule: "@every 20m"
      ofelia.job-exec.backup-satisfactory.command: "restic backup /data"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  restic-wakapi:
    image: restic/restic:latest
    container_name: restic-wakapi
    restart: unless-stopped
    entrypoint: /bin/sh
    command: '-c "tail -f /dev/null"'
    environment:
      - RESTIC_REPOSITORY=rest:http://rclone:${RESTIC_RCLONE_SERVER_PORT}/wakapi/
      - RESTIC_PASSWORD=${RESTIC_WAKAPI_PASSWORD}
    volumes:
      - ../../../storage/wakapi/data:/data:ro
    networks:
      - lab
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.backup-wakapi.schedule: "@every 20m"
      ofelia.job-exec.backup-wakapi.command: "restic backup /data"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 128M

  restic-hermes:
    image: restic/restic:latest
    container_name: restic-hermes
    restart: unless-stopped
    entrypoint: /bin/sh
    command: '-c "tail -f /dev/null"'
    environment:
      - RESTIC_REPOSITORY=rest:http://rclone:${RESTIC_RCLONE_SERVER_PORT}/hermes/
      - RESTIC_PASSWORD=${RESTIC_HERMES_PASSWORD}
    volumes:
      - ../../../storage/hermes/data:/data:ro
      - ./configuration/hermes-include.txt:/etc/restic/hermes-include.txt:ro
    networks:
      - lab
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.backup-hermes.schedule: "@every 6h"
      ofelia.job-exec.backup-hermes.command: "restic backup --files-from /etc/restic/hermes-include.txt"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 128M

  restic-ai-memory:
    image: restic/restic:latest
    container_name: restic-ai-memory
    restart: unless-stopped
    entrypoint: /bin/sh
    command: '-c "tail -f /dev/null"'
    environment:
      - RESTIC_REPOSITORY=rest:http://rclone:${RESTIC_RCLONE_SERVER_PORT}/ai-memory/
      - RESTIC_PASSWORD=${RESTIC_AI_MEMORY_PASSWORD}
    volumes:
      - ../../../storage/ai-memory/data:/data:ro
      - ./configuration/ai-memory-include.txt:/etc/restic/ai-memory-include.txt:ro
    networks:
      - lab
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.backup-ai-memory.schedule: "@every 1h"
      ofelia.job-exec.backup-ai-memory.command: "restic backup --files-from /etc/restic/ai-memory-include.txt"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  restic-terraform:
    image: restic/restic:latest
    container_name: restic-terraform
    restart: unless-stopped
    entrypoint: /bin/sh
    command: '-c "tail -f /dev/null"'
    environment:
      - RESTIC_REPOSITORY=rest:http://rclone:${RESTIC_RCLONE_SERVER_PORT}/terraform/
      - RESTIC_PASSWORD=${RESTIC_TERRAFORM_PASSWORD}
    volumes:
      - ../../../terraform:/data:ro
      - ./configuration/terraform-include.txt:/etc/restic/terraform-include.txt:ro
    networks:
      - lab
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.backup-terraform.schedule: "@every 6h"
      ofelia.job-exec.backup-terraform.command: "restic backup --files-from /etc/restic/terraform-include.txt"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  restic-lemon-sandbox:
    image: restic/restic:latest
    container_name: restic-lemon-sandbox
    restart: unless-stopped
    entrypoint: /bin/sh
    command: '-c "tail -f /dev/null"'
    environment:
      - RESTIC_REPOSITORY=rest:http://rclone:${RESTIC_RCLONE_SERVER_PORT}/lemon-sandbox/
      - RESTIC_PASSWORD=${RESTIC_LEMON_SANDBOX_PASSWORD}
    volumes:
      - ../../../storage/lemon-sandbox:/data:ro
      - ./configuration/lemon-sandbox-exclude.txt:/etc/restic/lemon-sandbox-exclude.txt:ro
    networks:
      - lab
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.backup-lemon-sandbox.schedule: "@every 6h"
      ofelia.job-exec.backup-lemon-sandbox.command: "restic backup /data --exclude-file /etc/restic/lemon-sandbox-exclude.txt"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 128M

networks:
  lab:
    name: lab
    external: true