storage:
  type: sqlite
  path: /data/data.db

ui:
  title: "Lab Monitoring"
  description: "What infrastructure and applications are running in the home lab."
  header: "Lab Monitoring"
  dashboard-heading: "Services"
  dashboard-subheading: "What infrastructure and applications are running in the home lab, checked every minute."
  logo: "https://raw.githubusercontent.com/Petri-Hub/lab/main/services/infra/gatus/logo.png"
  link: "https://github.com/Petri-Hub/lab"
  default-sort-by: name

endpoints:
  - name: Cloudflared
    group: Infrastructure
    url: "https://${GATUS_WAKAPI_DOMAIN}/api/health"
    interval: 5m
    ui:
      hide-hostname: true
      hide-port: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"

  - name: NGINX
    group: Infrastructure
    url: "tcp://nginx:80"
    interval: 1m
    ui:
      hide-hostname: true
      hide-port: true
      hide-url: true
    conditions:
      - "[CONNECTED] == true"

  - name: BTOP
    group: Infrastructure
    url: "http://btop:7681"
    interval: 1m
    ui:
      hide-hostname: true
      hide-port: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"

  - name: Rclone
    group: Infrastructure
    url: "tcp://rclone:${GATUS_RCLONE_PORT}"
    interval: 1m
    ui:
      hide-hostname: true
      hide-port: true
      hide-url: true
    conditions:
      - "[CONNECTED] == true"

  - name: UpSnap
    group: Infrastructure
    url: "http://172.19.0.1:${GATUS_UPSNAP_PORT}/api/health"
    interval: 1m
    ui:
      hide-hostname: true
      hide-port: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"

  - name: Prometheus
    group: Infrastructure
    url: "http://172.19.0.1:${GATUS_PROMETHEUS_PORT}/-/healthy"
    interval: 1m
    ui:
      hide-hostname: true
      hide-port: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"

  - name: cAdvisor
    group: Infrastructure
    url: "http://cadvisor:8080/healthz"
    interval: 1m
    ui:
      hide-hostname: true
      hide-port: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"

  # node_exporter binds only to host loopback, which containers cannot reach, so
  # this asks Prometheus whether its latest scrape of node_exporter succeeded.
  - name: Node Exporter
    group: Infrastructure
    url: "http://172.19.0.1:${GATUS_PROMETHEUS_PORT}/api/v1/query?query=up%7Bjob%3D%22node-exporter%22%7D"
    interval: 1m
    ui:
      hide-hostname: true
      hide-port: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY].data.result[0].value[1] == 1"

  - name: AI Memory
    group: Applications
    url: "http://ai-memory:49374/web/login"
    interval: 1m
    ui:
      hide-hostname: true
      hide-port: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"

  - name: Wakapi
    group: Applications
    url: "http://wakapi:3000/api/health"
    interval: 1m
    ui:
      hide-hostname: true
      hide-port: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"

  - name: Home Assistant
    group: Applications
    url: "http://homeassistant:8123/manifest.json"
    interval: 1m
    ui:
      hide-hostname: true
      hide-port: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"

  - name: Hermes
    group: Applications
    url: "http://hermes:9119/login"
    interval: 1m
    ui:
      hide-hostname: true
      hide-port: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"

  - name: TeamSpeak
    group: Applications
    url: "tcp://teamspeak:${GATUS_TEAMSPEAK_PORT}"
    interval: 1m
    ui:
      hide-hostname: true
      hide-port: true
      hide-url: true
    conditions:
      - "[CONNECTED] == true"

  - name: Lemon Sandbox
    group: Sandboxes
    url: "tcp://lemon-sandbox:22"
    interval: 1m
    ui:
      hide-hostname: true
      hide-port: true
      hide-url: true
    conditions:
      - "[CONNECTED] == true"
