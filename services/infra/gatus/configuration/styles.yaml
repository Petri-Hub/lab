ui:
  custom-css: |
    html:root.dark {
      --background: 0 0% 3.9%;
      --foreground: 0 0% 98%;
      --card: 0 0% 3.9%;
      --card-foreground: 0 0% 98%;
      --popover: 0 0% 3.9%;
      --popover-foreground: 0 0% 98%;
      --primary: 0 0% 98%;
      --primary-foreground: 0 0% 9%;
      --secondary: 0 0% 14.9%;
      --secondary-foreground: 0 0% 98%;
      --muted: 0 0% 14.9%;
      --muted-foreground: 0 0% 63.9%;
      --accent: 0 0% 14.9%;
      --accent-foreground: 0 0% 98%;
      --border: 0 0% 14.9%;
      --input: 0 0% 14.9%;
      --ring: 0 0% 83.1%;
    }

    html.dark .dark\:bg-gray-600 { background-color: #525252; }
    html.dark .dark\:bg-gray-700 { background-color: #404040; }
    html.dark .dark\:bg-gray-800 { background-color: #262626; }
    html.dark .dark\:bg-gray-800\/20 { background-color: rgba(38, 38, 38, 0.2); }
    html.dark .dark\:bg-gray-800\/50 { background-color: rgba(38, 38, 38, 0.5); }
    html.dark .dark\:border-gray-400 { border-color: #a3a3a3; }
    html.dark .dark\:border-gray-600 { border-color: #525252; }
    html.dark .dark\:hover\:bg-gray-700:hover { background-color: #404040; }
    html.dark .dark\:hover\:border-gray-700:hover { border-color: #404040; }
    html.dark .dark\:text-gray-100 { color: #f5f5f5; }
    html.dark .dark\:text-gray-300 { color: #d4d4d4; }
    html.dark .dark\:text-gray-400 { color: #a3a3a3; }

    .container.max-w-7xl { max-width: 980px; }

    .endpoint-group-header { border-left: 4px solid #f6821f; }

    #global > .relative { display: flex; flex-direction: column; min-height: 100vh; }
    #global > .relative > main { flex: 1 0 auto; }

    .bg-card.rounded-lg.border:has(#search-input) { display: none; }
    .mb-6:has(#search-input) > .justify-between { margin-bottom: 0; }
