global:
  scrape_interval: 30s
  scrape_timeout: 10s

storage:
  tsdb:
    retention:
      time: 90d
      size: 16GB

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["localhost:48080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["localhost:9100"]
