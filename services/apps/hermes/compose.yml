services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - ${HERMES_GATEWAY_PORT}:8642
      - ${HERMES_DASHBOARD_PORT}:9119
    networks:
      - lab
    volumes:
      - ../../../storage/hermes/data:/opt/data
      - ../../../storage/hermes/secrets/github-app.pem:/opt/data/github-app.pem:ro
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_TUI=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      - DISCORD_BOT_TOKEN=${HERMES_DISCORD_BOT_TOKEN}
      - DISCORD_ALLOWED_USERS=${HERMES_DISCORD_ALLOWED_USERS}
      - DISCORD_ALLOW_ANY_ATTACHMENT=${HERMES_DISCORD_ALLOW_ANY_ATTACHMENT}
      - OPENAI_API_KEY=${HERMES_OPENAI_API_KEY}
      - VOICE_TOOLS_OPENAI_KEY=${HERMES_OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${HERMES_TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${HERMES_TELEGRAM_ALLOWED_USERS}
      - GITHUB_APP_ID=${HERMES_PEPPER_GITHUB_APP_ID}
      - GITHUB_APP_INSTALLATION_ID=${HERMES_PEPPER_GITHUB_APP_INSTALLATION_ID}
      - GITHUB_APP_PRIVATE_KEY_PATH=/opt/data/github-app.pem
    shm_size: '1gb'
    # The Telegram API hostname is dual-stack and its IPv6 path is dead on this host,
    # so outbound calls race and intermittently fail. The gateway pins IPv4 on its own;
    # this makes every process in the container do the same.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

networks:
  lab:
    name: lab
    external: true
