services:
  moonlight-web:
    image: ghcr.io/linckosz/moonlight-web:0.4.3
    container_name: moonlight-web
    restart: unless-stopped
    # WebRTC and mDNS need direct access to the lab host's network.
    network_mode: host
    user: '${MOONLIGHT_WEB_UID:?Set the UID}:${MOONLIGHT_WEB_GID:?Set the GID}'
    cap_drop:
      - ALL
    environment:
      MW_HTTP_PORT: ${MOONLIGHT_WEB_HTTP_PORT:?Set the HTTP port}
      MW_HTTPS_PORT: ${MOONLIGHT_WEB_HTTPS_PORT:?Set the HTTPS port}
      MW_UPNP: '0'
      MW_LAN_ONLY: '1'
      TZ: America/Sao_Paulo
    volumes:
      - ../../../storage/moonlight-web:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
