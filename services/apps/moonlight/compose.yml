services:
  moonlight:
    image: ghcr.io/linckosz/moonlight-web:0.4.3
    container_name: moonlight
    restart: unless-stopped
    network_mode: host
    user: '${MOONLIGHT_UID:?Set the UID}:${MOONLIGHT_GID:?Set the GID}'
    cap_drop:
      - ALL
    environment:
      MW_HTTP_PORT: ${MOONLIGHT_HTTP_PORT:?Set the HTTP port}
      MW_HTTPS_PORT: ${MOONLIGHT_HTTPS_PORT:?Set the HTTPS port}
      MW_UPNP: '0'
      MW_LAN_ONLY: '1'
      TZ: America/Sao_Paulo
    volumes:
      - ../../../storage/moonlight:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
